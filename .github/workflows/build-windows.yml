name: Build AFK Controller

on:
  push:
    branches: [ main, ui-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Vendor vgamepad without interactive installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yannbouteiller/vgamepad/archive/refs/tags/v0.1.0.zip" -OutFile "vendor\vgamepad.zip"
          Expand-Archive -Path "vendor\vgamepad.zip" -DestinationPath "vendor\src" -Force
          Copy-Item -Path "vendor\src\vgamepad-0.1.0\vgamepad" -Destination ".\vgamepad" -Recurse -Force
          if (!(Test-Path ".\vgamepad\win\vigem\client\x64\ViGEmClient.dll")) { throw "ViGEmClient.dll missing" }

      - name: Validate source and UI
        shell: pwsh
        run: |
          python -m py_compile app.py controller_lab.py
          python -m compileall -q vgamepad
          $env:QT_QPA_PLATFORM='offscreen'
          python -c "from PySide6.QtWidgets import QApplication; import app; q=QApplication([]); w=app.MainWindow(); print(w.windowTitle()); w.close()"

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AFKController --collect-all dxcam --collect-all comtypes --add-binary "vgamepad\win\vigem\client\x64\ViGEmClient.dll;vgamepad\win\vigem\client\x64" app.py

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\dist\AFKController.exe).Hash
          "AFKController.exe  SHA256=$hash" | Out-File -Encoding ascii .\dist\SHA256.txt
          Write-Host "SHA256=$hash"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AFKController-Windows
          path: |
            dist/AFKController.exe
            dist/SHA256.txt
          if-no-files-found: error
